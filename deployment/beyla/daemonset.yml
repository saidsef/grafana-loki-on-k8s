---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: beyla
  labels:
    app.kubernetes.io/name: beyla
spec:
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: beyla
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: beyla
        cluster: kubernetes
    spec:
      # Privileges, host mounts and their rationale: see docs/beyla.md.
      serviceAccountName: beyla
      hostPID: true
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: beyla
          image: docker.io/grafana/beyla:3.30.0
          imagePullPolicy: IfNotPresent
          ports:
          - name: health
            containerPort: 9090
            protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9090
            initialDelaySeconds: 30
            periodSeconds: 30
          env:
            - name: BEYLA_CONFIG_PATH
              value: "/etc/beyla/config/beyla-config.yml"
            - name: BEYLA_KUBE_METADATA_ENABLE
              value: "autodetect"
            - name: BEYLA_KUBE_CLUSTER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['cluster']
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "k8s.node.name=$(NODE_NAME)"
            - name: GOMAXPROCS
              valueFrom:
                resourceFieldRef:
                  divisor: '1'
                  resource: limits.cpu
            - name: GOMEMLIMIT
              valueFrom:
                resourceFieldRef:
                  divisor: '1'
                  resource: limits.memory
          # privileged: true would grant all of these implicitly and make
          # enforce_sys_caps unable to fire. Keep the list explicit.
          securityContext:
            runAsUser: 0
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - BPF
                - SYS_PTRACE
                - NET_RAW
                - CHECKPOINT_RESTORE
                - DAC_READ_SEARCH
                - PERFMON
                - NET_ADMIN
                - SYS_ADMIN
          resources:
            limits:
              cpu: 100m
              memory: 768Mi
            requests:
              cpu: 50m
              memory: 512Mi
          volumeMounts:
            - mountPath: /etc/beyla/config
              name: beyla-config
            - name: cgroup
              mountPath: /sys/fs/cgroup
              readOnly: true
            - name: tracefs
              mountPath: /sys/kernel/tracing
            # Must resolve to a real bpffs, and Cilium mounts it after we may start,
            # hence the propagation. Without it, pinned maps are silently disabled.
            - name: bpffs
              mountPath: /sys/fs/bpf
              mountPropagation: HostToContainer
      volumes:
        - name: beyla-config
          configMap:
            name: beyla
        - name: cgroup
          hostPath:
            path: /sys/fs/cgroup
        - name: tracefs
          hostPath:
            path: /sys/kernel/tracing
        - name: bpffs
          hostPath:
            path: /sys/fs/bpf
            type: Directory